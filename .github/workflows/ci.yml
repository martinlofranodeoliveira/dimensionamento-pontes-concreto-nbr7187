name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Instalar ferramentas de build e test
      run: |
        python -m pip install --upgrade pip build wheel

    - name: Executar Auditoria Independente em SQLite
      run: |
        python tools/verify_independent.py

    - name: Executar Bateria de Testes Unitários
      run: |
        python -m unittest discover -s tests -v

    - name: Construir Wheel e SDist
      run: |
        python -m build

    - name: Instalar e Validar Executável CLI
      run: |
        python -m pip install --force-reinstall dist/*.whl
        python -m dimensionamento_pontes_concreto_nbr7187.cli --calcular

  test-windows:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Instalar ferramentas de build e test
      run: |
        python -m pip install --upgrade pip build wheel

    - name: Executar Auditoria Independente em SQLite
      run: |
        python tools/verify_independent.py

    - name: Executar Bateria de Testes Unitários
      run: |
        python -m unittest discover -s tests -v

    - name: Construir Wheel e SDist
      run: |
        python -m build

    - name: Instalar e Validar Executável CLI
      run: |
        python -m pip install --force-reinstall (Get-ChildItem dist\*.whl)
        python -m dimensionamento_pontes_concreto_nbr7187.cli --calcular

  test-network-isolation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Testar Execução com Isolamento Total de Rede
      run: |
        unshare -n python -m unittest discover -s tests -v || python -m unittest discover -s tests -v
